<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Talaia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23070a0f'/%3E%3Cg fill='none' stroke='%2338d6c4' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 21l1.6-11h4.8L16 21M7 10h10M9 10V6h6v4M12 6V3.5M6.5 21h11'/%3E%3Cpath d='M5 4.5a5.5 5.5 0 0 0 0 5M19 4.5a5.5 5.5 0 0 1 0 5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<script src="app.js" defer></script>
<script src="semana.js" defer></script>
</head>
<body>
<a class="saltar" href="#contenido" id="saltar">Saltar al contenido</a>
<header class="cabecera">
  <div class="marca">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 22l1.6-12h4.8L16 22M7 10h10M9 10V6h6v4M12 6V3M9.2 15.5h5.6M6 22h12"/><path d="M5 4a6 6 0 0 0 0 6M19 4a6 6 0 0 1 0 6"/>
    </svg>
    <h1>TALAIA</h1>
  </div>
  <nav class="secciones" aria-label="Secciones">
    <a href="#/directo" data-seccion="directo">Directo</a>
    <a href="#/semana" data-seccion="semana">Semana</a>
    <a href="#/fuentes" data-seccion="fuentes">Fuentes</a>
  </nav>
  <div class="estado">
    <span class="directo" id="directo">EN DIRECTO</span>
    <span><b id="total">–</b> titulares</span>
    <span>act. <b id="hace">–</b></span>
    <span id="reloj" class="reloj" aria-hidden="true">--:--</span>
    <button class="refrescar" id="refrescar" type="button" aria-label="Recargar titulares" title="Recargar titulares">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>
<div id="avisos" class="avisos"></div>
<div id="anuncio" class="solo-lector" aria-live="polite"></div>
<main id="contenido" tabindex="-1">
  <section id="vista-directo" class="vista" aria-labelledby="titulo-directo" hidden>
    <h2 id="titulo-directo" class="solo-lector" tabindex="-1">Directo</h2>
    <nav class="zonas" aria-label="Zonas y vistas de Directo">
      <ul id="zonas"></ul>
    </nav>
    <form class="filtros" id="filtros" role="search" onsubmit="return false">
      <label class="buscar"><span class="solo-lector">Buscar en titulares y medios</span>
        <input type="search" id="q" placeholder="Buscar titulares o medios" autocomplete="off">
      </label>
      <details class="medios" id="filtro-medios">
        <summary>Medios <span id="n-medios"></span></summary>
        <fieldset><legend class="solo-lector">Mostrar solo estos medios</legend><div id="lista-medios"></div></fieldset>
      </details>
      <label class="casilla"><input type="checkbox" id="sin-premium"> Ocultar premium</label>
      <label class="orden">Orden
        <select id="orden">
          <option value="recientes">Recientes</option>
          <option value="contrastadas">Más contrastadas</option>
          <option value="diversidad">Diversidad de medios</option>
        </select>
      </label>
      <p class="resumen-filtros" id="resumen-filtros" aria-live="off"></p>
      <button type="button" class="limpiar" id="limpiar" hidden>Limpiar</button>
    </form>
    <section class="destacadas" id="destacadas" aria-labelledby="titulo-destacadas" hidden>
      <div class="destacadas-cab">
        <h3 id="titulo-destacadas">Más cubiertas</h3>
        <p class="nota">Hechos contados por más medios distintos en 24 h. No mide importancia.</p>
        <button type="button" class="plegar" id="plegar-destacadas" aria-expanded="true" aria-controls="lista-destacadas">Plegar</button>
      </div>
      <ol id="lista-destacadas" data-lista="destacadas"></ol>
    </section>
    <div class="columnas" id="columnas"></div>
    <button type="button" class="nuevas" id="nuevas" hidden></button>
  </section>
  <section id="vista-semana" class="vista" aria-labelledby="titulo-semana" hidden></section>
  <section id="vista-fuentes" class="vista" aria-labelledby="titulo-fuentes" hidden></section>
  <noscript><p class="vacio">Talaia necesita JavaScript para mostrar los titulares.</p></noscript>
</main>
</body>
</html>
