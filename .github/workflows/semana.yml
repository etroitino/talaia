name: Informe semanal

# Genera el informe y lo sube a la rama archivo; NO publica Pages: lanza recoger.yml, que monta el
# sitio completo. Actions solo entiende cron en UTC, así que se programan las dos horas UTC posibles
# (verano/invierno) y semana.py --auto decide con la hora de Madrid; lo ya hecho no se repite.
# Además recoger.yml (cada 15 min vía cron-job.org) lo lanza cuando toca, por si el schedule se retrasa.
on:
  schedule:
    - cron: "0 7,8 * * 0"     # domingo 09:00 de Madrid: 07:00 UTC (CEST) u 08:00 UTC (CET)
    - cron: "30 22,23 * * 0"  # lunes 00:30 de Madrid: 22:30 UTC (CEST) o 23:30 UTC (CET) del domingo
    - cron: "15 6 * * 1-3"    # reintentos: datos tardíos o análisis incompleto
  workflow_dispatch:
    inputs:
      week:
        description: "Semana ISO AAAA-Www (vacío = automático)"
        required: false
      as_of:
        description: "Fecha de corte ISO 8601 (opcional, p. ej. 2026-10-25T09:00:00+01:00)"
        required: false
      no_llm:
        description: "Sin IA (solo cobertura y titulares)"
        type: boolean
        default: false
      dry_run:
        description: "Prueba: no guarda nada"
        type: boolean
        default: false
      forzar:
        description: "Regenerar aunque la entrada no haya cambiado"
        type: boolean
        default: false

permissions:
  contents: write   # subir el informe a la rama archivo
  actions: write    # lanzar recoger.yml para publicarlo

concurrency:
  group: semana
  cancel-in-progress: false

jobs:
  semana:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: .modelos
          key: modelos-${{ hashFiles('agrupar.py') }}
          restore-keys: modelos-

      - name: Generar informe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # si no existe, el informe sale "sin IA" y lo dice
          WEEK: ${{ inputs.week }}
          AS_OF: ${{ inputs.as_of }}
          NO_LLM: ${{ inputs.no_llm }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          args=()
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); else args+=(--auto); fi
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          if [ "$NO_LLM" = "true" ]; then args+=(--no-llm); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run --salida _semana); fi
          if [ "$FORZAR" = "true" ]; then args+=(--forzar); fi
          uv run semana.py "${args[@]}"

      - name: Publicar (lanza la recogida, que monta el sitio)
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recoger.yml --ref "$GITHUB_REF_NAME"
