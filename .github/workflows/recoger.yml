name: Recoger titulares

# La lanza cron-job.org cada 15 min (workflow_dispatch); el schedule es solo respaldo.
# Es el ÚNICO workflow que publica Pages: monta el sitio entero (Directo + semana/ de la rama archivo)
# con montar_sitio.py, así ninguna publicación borra lo de otra.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # cada 15 min, fuera de los minutos en punto (los más saturados en GitHub)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # solo para subir capturas a la rama archivo (nunca a main)
  pages: write
  id-token: write
  actions: write    # para lanzar semana.yml cuando toca

# Recoger y publicar van en jobs y grupos distintos: si el entorno github-pages se atasca (como la
# ejecución 42670137053, en "waiting" del 9 al 10-nov-2026), la recogida y las capturas siguen.
jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dos recogidas nunca se pisan (leer, fusionar, capturar)
    concurrency:
      group: recoger
      cancel-in-progress: false
    outputs:
      version: ${{ steps.montar.outputs.version }}
      actualizado: ${{ steps.montar.outputs.actualizado }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # Sin commits en main: se parte del datos.json publicado (el ?t= evita la caché de Pages).
      # Si no está, se reconstruye desde las capturas de la rama archivo.
      - name: Descargar datos publicados
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/datos.json?t=$(date +%s)"
          if curl -fsSL "$url" -o datos.json && python3 -c "import json; json.load(open('datos.json'))['noticias']"; then
            echo "Partiendo de $(python3 -c "import json; print(len(json.load(open('datos.json'))['noticias']))") noticias"
          else
            rm -f datos.json
            uv run archivo.py restaurar datos.json || echo "Sin datos previos válidos: se empieza de cero"
          fi

      - run: uv run recoger.py

      # Modelo de embeddings (~240 MB): en caché para no descargarlo cada 15 min
      - uses: actions/cache@v4
        with:
          path: .modelos
          key: modelos-${{ hashFiles('agrupar.py') }}
          restore-keys: modelos-

      - run: uv run agrupar.py

      # Capturas incrementales de metadatos (sin textos) por semana ISO. Si falla, Directo se publica igual.
      - name: Guardar capturas en la rama archivo
        continue-on-error: true
        run: uv run archivo.py capturar datos.json

      # Si la rama archivo no está disponible, montar_sitio.py copia semana/ de lo publicado;
      # y no publica si lo publicado es más reciente que estos datos.
      - name: Montar sitio
        id: montar
        run: |
          uv run montar_sitio.py --publicado "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 -c "import json; v = json.load(open('_site/version.json')); print(f'version={v[\"version\"]}'); print(f'actualizado={v[\"actualizado\"]}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Calendario semanal en hora de Madrid (semana.py decide; nada de desfases UTC fijos)
      - name: ¿Toca el informe semanal?
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if uv run --with pyyaml python semana.py --auto --solo-comprobar --local; then
            gh workflow run semana.yml --ref "$GITHUB_REF_NAME"
          fi

  publicar:
    needs: recoger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Grupo nuevo: un despliegue cada vez, sin cancelar el que está en curso. Los jobs entran en el grupo en el
    # orden en que acaba la recogida (serializada), y uno pendiente se sustituye por el siguiente.
    concurrency:
      group: pages-despliegue
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      actions: read     # para ver si una ejecución posterior ya desplegó
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      # No se consulta lo que sirve Pages: el 9-nov-2026 sirvió una versión antigua durante 17 h mientras
      # Actions marcaba correctos los despliegues. La referencia es Actions: si una ejecución posterior ya
      # desplegó, esta no lo hace (p. ej. al relanzar una ejecución vieja). Si no se puede comprobar, no se despliega.
      - name: ¿Ya desplegó una ejecución posterior?
        id: orden
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: publicar
          PASO: Desplegar
        run: |
          set -euo pipefail
          workflow=$(basename "${GITHUB_WORKFLOW_REF%@*}")   # este mismo archivo de workflow
          creado=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          posteriores=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?created=%3E$creado&per_page=50" --jq '.workflow_runs[].id')
          for id in $posteriores; do
            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            # filter=all: también los intentos anteriores (un reintento que falla no deshace un despliegue previo)
            paso=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=all&per_page=100" \
                   --jq "[.jobs[] | select(.name == \"$JOB\") | .steps[]? | select(.name == \"$PASO\") | .conclusion] | join(\",\")")
            if [[ ",$paso," == *",success,"* ]]; then
              echo "::notice::La ejecución $id, posterior, ya desplegó; esta no despliega"
              echo "desplegar=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "desplegar=si" >> "$GITHUB_OUTPUT"

      - name: Desplegar
        id: desplegar
        if: steps.orden.outputs.desplegar == 'si'
        uses: actions/deploy-pages@v4

      # "Reported success" no basta: el 9 y 10-nov-2026 Pages siguió sirviendo, o volvió a servir, versiones
      # anteriores. La CDN ignora "?t=" y guarda una copia por Accept-Encoding (max-age=600), así que se lee
      # como un navegador y con y sin compresión. Hacen falta 3 lecturas seguidas con esta versión o una posterior;
      # si no llegan en 12 min, el job falla y queda a la vista. La siguiente recogida lo vuelve a intentar.
      - name: ¿Pages sirve lo desplegado?
        if: steps.orden.outputs.desplegar == 'si'
        env:
          ESPERADA: ${{ needs.recoger.outputs.version }}
          ACTUALIZADO: ${{ needs.recoger.outputs.actualizado }}
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/version.json"
          leer() {
            curl -fsSL --compressed -H "Accept-Encoding: $1" "$url" \
              | python3 -c "import json,sys; v = json.load(sys.stdin); print(v['version'], v['actualizado'])" 2>/dev/null || echo "- -"
          }
          # ISO en UTC con el mismo formato: se compara como texto
          vale() { [[ "$1" == "$ESPERADA" || ( "$2" != "-" && ! "$2" < "$ACTUALIZADO" ) ]]; }
          seguidas=0
          for i in $(seq 1 48); do
            ok=1
            for enc in "gzip, deflate, br" "identity"; do
              read -r servida fecha < <(leer "$enc")
              vale "$servida" "$fecha" || ok=0
            done
            if (( ok )); then seguidas=$((seguidas + 1)); else seguidas=0; fi
            (( seguidas >= 3 )) && { echo "Pages sirve $servida ($fecha)"; exit 0; }
            sleep 15
          done
          echo "::error::Pages sirve '$servida' ($fecha) en vez de $ESPERADA ($ACTUALIZADO) 12 min después de desplegar"
          exit 1
